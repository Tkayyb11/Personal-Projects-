<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index1.html">
                <img src="https://i.fbcd.co/products/resized/resized-1500-1000/university-logo-converted-01-45c1f69249d8d113e17549c483a945debce48c771b5a4bcdf54fd6f890833276.webp" alt="University Logo" class="logo">
            </a>
            <span class="logo-text">Student Course Hub</span>
        </div>    
        <nav>
            <a href="modules.html">Modules</a>
            <a href="staff.html">Staff</a>
            <a href="admin_dashboard.html" id="admin-dashboard-link" style="display:none;">Admin Dashboard</a>
            <a href="admin_login.html" id="login-link">Login</a>
            <a href="#" id="logout-link" style="display:none;">Logout</a>
        </nav>
    </header>

    <section class="programme-header" id="programme-header">
        <h1 id="programme-name">Programme Name</h1>
    </section>

    <main class="programme-details">
        <section class="programme-section">
            <h2>About this Programme</h2>
            <p id="programme-description">Programme description goes here.</p>
        </section>

        <section class="programme-section">
            <h3>Programme Leader</h3>
            <p id="programme-leader">Loading...</p>
        </section>

        <section class="programme-section">
            <h3>Year 1 Modules</h3>
            <ul id="modules-year1"></ul>
        </section>

        <section class="programme-section">
            <h3>Year 2 Modules</h3>
            <ul id="modules-year2"></ul>
        </section>

        <section class="programme-section">
            <h3>Year 3 Modules</h3>
            <ul id="modules-year3"></ul>
        </section>

        <section class="programme-section">
            <h3>Register Your Interest</h3>
            <form id="register-form">
                <label for="student-name">Full Name:</label>
                <input type="text" id="student-name" required>
        
                <label for="student-email">Email:</label>
                <input type="email" id="student-email" required>
        
                <button type="submit">Register Interest</button>
                <p id="register-message"></p>

                <button id="withdraw-button">Withdraw Interest</button>
                <p id="withdraw-message"></p>
            </form>
        </section>
         
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginLink = document.getElementById('login-link');
            const logoutLink = document.getElementById('logout-link');
            const adminDashboardLink = document.getElementById('admin-dashboard-link');

            function checkLoginStatus() {
                const adminToken = localStorage.getItem('adminToken');
                if (adminToken) {
                    loginLink.style.display = 'none';
                    logoutLink.style.display = 'block';
                    adminDashboardLink.style.display = 'block';
                } else {
                    loginLink.style.display = 'block';
                    logoutLink.style.display = 'none';
                    adminDashboardLink.style.display = 'none';
                }
            }

            checkLoginStatus();

            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('adminToken');
                checkLoginStatus();
                window.location.href = 'admin_login.html';
            });
        });
    </script>

    <script src="programme_details.js"></script>
</body>
</html>
